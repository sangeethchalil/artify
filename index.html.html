<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artify — Art Gallery & Store</title>
<meta name="description" content="Artify: original paintings, a living gallery and a store for art lovers.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--choc:#2b1810;--blk:#0a0a0a;--gold:#d4af37;--cream:#f5ecd9;--mut:#b9a994;--card:#1a0f0a;--ln:rgba(212,175,55,.35);--inp:#120a06;--og:#1a0f0a;--hdr:rgba(10,10,10,.92);--hero:radial-gradient(ellipse at 70% 40%,#4a2a1a,#2b1810 45%,#0a0a0a);--wall:linear-gradient(180deg,#3a2217,#24140c);--err:#e88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--choc:#efe3cc;--blk:#faf5ea;--gold:#8f6b12;--cream:#2b1810;--mut:#6e5d4a;--card:#fffaf0;--ln:rgba(143,107,18,.4);--inp:#fff;--og:#fff;--hdr:rgba(250,245,234,.94);--hero:radial-gradient(ellipse at 70% 40%,#f3dfb5,#efe3cc 50%,#faf5ea);--wall:linear-gradient(180deg,#e6d3ad,#d5bf91);--err:#a12a2a}}
:root[data-theme=light]{color-scheme:light;--choc:#efe3cc;--blk:#faf5ea;--gold:#8f6b12;--cream:#2b1810;--mut:#6e5d4a;--card:#fffaf0;--ln:rgba(143,107,18,.4);--inp:#fff;--og:#fff;--hdr:rgba(250,245,234,.94);--hero:radial-gradient(ellipse at 70% 40%,#f3dfb5,#efe3cc 50%,#faf5ea);--wall:linear-gradient(180deg,#e6d3ad,#d5bf91);--err:#a12a2a}
html{scroll-padding-top:70px;scroll-behavior:smooth;height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--blk);color:var(--cream);font:300 15px/1.6 Poppins,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}
a{color:var(--gold)}
header{flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:var(--hdr);border-bottom:1px solid var(--ln)}
.logo{font:700 26px 'Playfair Display',serif;color:var(--gold);letter-spacing:2px}
nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}nav a{text-decoration:none;color:var(--cream);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.btn{background:var(--gold);color:var(--og);border:0;padding:11px 22px;font:500 13px Poppins,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.s{padding:6px 12px;font-size:11px}.btn.r{background:#8b2a2a;color:#fff}
.hero{min-height:88vh;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:50px 5vw;background:var(--hero)}
.hero h1{font-size:clamp(34px,5vw,64px);line-height:1.15;color:var(--cream);margin:12px 0 18px}
.hero h1 em{color:var(--gold)}.kick{color:var(--gold);letter-spacing:4px;font-size:12px;text-transform:uppercase}
  .wall{display:flex;gap:90px;justify-content:center;align-items:flex-start;padding:70px 0 30px}
.frame{border:10px solid #b8902a;outline:2px solid #6b4e10;background:#111;box-shadow:0 18px 30px #000a,inset 0 0 12px #000;padding:8px;background-clip:padding-box;flex:1;max-width:230px;position:relative}.ring{padding:8px;border-radius:50%;background:#b8902a;box-shadow:0 14px 28px #0008,inset 0 0 8px #0006}.frame:before{content:'';position:absolute;left:12%;right:12%;top:-46px;height:46px;background:linear-gradient(to top right,transparent calc(50% - .6px),var(--gold) 50%,transparent calc(50% + .6px)) left/50% 100% no-repeat,linear-gradient(to top left,transparent calc(50% - .6px),var(--gold) 50%,transparent calc(50% + .6px)) right/50% 100% no-repeat}.frame:after{content:'';position:absolute;left:calc(50% - 5px);top:-52px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 2px 4px #0008}
.frame:nth-child(2){max-width:170px;margin-top:60px}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
section{padding:70px 5vw}section.alt{background:var(--choc)}
.sh{text-align:center;margin-bottom:34px}.sh h2{font-size:clamp(28px,4vw,42px);color:var(--gold)}.sh p{color:var(--mut);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--ln);cursor:pointer;transition:.25s;position:relative}.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.cb{padding:14px}
.cb h3{font-size:18px}.mut{color:var(--mut);font-size:13px}.star{color:var(--gold);letter-spacing:2px}
.old{text-decoration:line-through;color:var(--mut)}.off{color:var(--gold);font-size:18px;font-weight:500}
.tag{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--og);font-size:11px;padding:2px 8px}.tag.sold{background:#8b2a2a;color:#fff;left:auto;right:10px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
input,select,textarea{background:var(--inp);color:var(--cream);border:1px solid var(--ln);padding:10px;font:inherit;border-radius:2px;width:100%}
.bar input,.bar select{width:auto;min-width:160px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;overflow:auto;padding:4vh 4vw}
.modal{max-width:900px;margin:0 auto;background:var(--choc);border:1px solid var(--gold);padding:24px;position:relative}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--gold);font-size:28px;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.main{width:100%;aspect-ratio:4/5;object-fit:cover}.th{display:flex;gap:8px;margin-top:8px}.th img{width:56px;height:70px;object-fit:cover;cursor:pointer;border:1px solid var(--ln)}.th img.on{border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}label{font-size:12px;color:var(--mut);display:block;margin:10px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
footer{padding:40px 5vw;text-align:center;border-top:1px solid var(--ln);color:var(--mut)}
.note{background:var(--inp);border-left:3px solid var(--gold);padding:8px 12px;font-size:12px;color:var(--mut);margin:10px 0}
#about .ab{display:grid;grid-template-columns:280px 1fr;gap:40px;max-width:900px;margin:0 auto;align-items:center}
.ab img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:50%}
.ib{display:inline-flex;align-items:center;gap:8px}.ib svg{width:18px;height:18px;flex:none}
.ab p{white-space:pre-line;font-size:16px}.sig{color:var(--gold);font-size:22px;margin-top:14px}
.hb{display:flex;gap:8px;align-items:center}.mb{display:none}.ph{display:flex;gap:6px}.ph select{width:44%;flex:none}.ph input{flex:1;min-width:0}
.card:focus-visible,[data-a=rate]:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.rv img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}.rv .star{font-size:13px}
@media(max-width:760px){.wall{gap:50px}.ab{grid-template-columns:1fr!important}.hero,.two{grid-template-columns:1fr}.frame:nth-child(2){margin-top:30px}nav{display:none}header.open nav{display:flex;order:3;flex-basis:100%;flex-direction:column;align-items:flex-start;gap:0;padding-top:8px}nav a{padding:10px 0;width:100%}.mb{display:inline-block}}
</style></head><body>
<header><div class="logo">ARTIFY</div><nav id="nv"><a href="#gallery">Gallery</a><a href="#store">Store</a><a href="#about">About</a><a href="#contact">Contact</a></nav><div class="hb"><button class="btn o s" id="tb" data-a="theme" aria-label="Toggle light or dark mode"></button><button class="btn o s mb" data-a="menu" aria-label="Menu" aria-expanded="false">☰</button></div></header>
<main id="app"></main>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pal=[['#c9a24a','#3a1f12','#8b3a2a'],['#1d3b4f','#d4af37','#0a0a0a'],['#6b2d2d','#e8d7b0','#2b1810'],['#2f4a3a','#d9b866','#14110e'],['#4a2c5a','#e0a85a','#0f0a12'],['#8a5a2b','#f0e2c0','#2a160c']];
function art(n){const p=pal[n%6],k=n*37;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><circle cx="${120+k%160}" cy="${140+k%80}" r="${70+k%40}" fill="${p[2]}" opacity=".75"/><path d="M0 ${340+k%60} Q120 ${260+k%50} 220 360 T400 ${320+k%40} V500 H0Z" fill="${p[2]}" opacity=".85"/><circle cx="${280-k%60}" cy="${90+k%40}" r="26" fill="#fff" opacity=".5"/></svg>`)}
const avatar=n=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#3a2217"/><circle cx="200" cy="200" r="90" fill="#d4af37"/><text x="200" y="232" font-size="90" text-anchor="middle" fill="#2b1810" font-family="Georgia,serif">${esc((n||'A')[0].toUpperCase())}</text><path d="M60 500 Q200 320 340 500Z" fill="#d4af37"/></svg>`);
const IC={gm:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>',fb:'<path fill="currentColor" stroke="none" d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V9a1 1 0 0 1 1-1z"/>',wa:'<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z"/><path fill="currentColor" stroke="none" d="M9 7.500c-.5 3.700 3.800 8 7.500 7.500l.5-2-2.200-1.100-1 1c-1-.4-2.200-1.600-2.600-2.600l1-1L10.900 7.500z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const url=u=>/^https?:\/\//i.test(u)?u:'https://'+u;
const src=x=>typeof x==='number'?art(x):x;
const KEY='artify_demo_v1';
const def=()=>({tag:'Where Every Stroke Tells a Story',wa:'919999999999',email:'hello@artify.example',frames:[1,4],
works:[[1,'Golden Hour Reverie',2025,'Oil on canvas'],[2,'Midnight Monsoon',2025,'Acrylic'],[3,'Ember Fields',2024,'Oil'],[4,'Whispering Palms',2024,'Watercolor'],[5,'Violet Silence',2026,'Mixed media'],[6,'Amber Tide',2026,'Oil on canvas']].map(a=>({id:a[0],t:a[1],y:a[2],m:a[3],img:a[0]+10})),
products:[[1,'Golden Hour Reverie','A warm abstract of dusk over the backwaters.','24 x 30 in','Oil on canvas',18000,14500,1],[2,'Midnight Monsoon','Moody blues with gold leaf highlights.','18 x 24 in','Acrylic on canvas',9000,7200,1],[3,'Ember Fields','Rich earthy tones of harvest season.','30 x 40 in','Oil on linen',26000,0,1],[4,'Whispering Palms','Light-filled coastal watercolor.','12 x 16 in','Watercolor on paper',4500,3800,0],[5,'Violet Silence','Contemporary mixed-media statement piece.','24 x 36 in','Mixed media',15000,12000,1],[6,'Amber Tide','Flowing waves in amber and bronze.','20 x 28 in','Oil on canvas',11000,9500,1]].map(a=>({id:a[0],n:a[1],d:a[2],sz:a[3],mat:a[4],p:a[5],o:a[6],av:a[7],imgs:[a[0]+20,a[0]+21,a[0]+22]})),
visit:{title:'Visit Artify',sub:'Get in touch, follow our journey, or commission a painting made just for you',cmText:'Commission a Painting',show:{gm:1,ig:1,fb:1,wa:1,cm:1}},aboutArt:"Artify is an art gallery and studio devoted to original paintings that carry emotion, colour and story. Here you can explore our latest works, rate your favourites, book pieces from the store, or commission a painting made just for you.\n\nEvery artwork is created with care, so it can become a lasting part of your home.",social:{ig:'https://instagram.com/artify',fb:'https://facebook.com/artify'},about:{name:'Sangeeth',role:'Founder & Artist',photo:null,text:"Hello, I'm Sangeeth, the founder of Artify.\n\nArtify was born from a simple belief: every painting carries a story, and every home deserves one. I create original artworks and curate pieces that bring warmth, colour and emotion into the spaces you love.\n\nWhether you are a collector or buying your very first painting, I'd be delighted to help you find the perfect piece."}});
const SB={url:'https://YOUR-PROJECT-ID.supabase.co',key:'YOUR-ANON-PUBLIC-KEY'}; // <-- paste your Supabase values here
const ready=!/YOUR-/.test(SB.url+SB.key);let JWT=null;
const sb=async(p,o={})=>{if(!ready)throw new Error('Database not configured');const r=await fetch(SB.url+p,{...o,headers:{apikey:SB.key,Authorization:'Bearer '+(JWT||SB.key),'Content-Type':'application/json',Prefer:'return=minimal',...o.headers}});if(!r.ok)throw new Error((await r.text()).slice(0,200)||r.status);const t=await r.text();return t?JSON.parse(t):null};
let S=def(),ENQ=[],REV=[],rvR=0,rvP=null;const R={};
const fix=()=>{const d=def();S.about=S.about||d.about;S.aboutArt=S.aboutArt||d.aboutArt;S.social=S.social||d.social;S.visit=S.visit||d.visit;S.visit.show=S.visit.show||d.visit.show};
const mineR=()=>{try{return JSON.parse(localStorage.getItem('artify_mine'))||{}}catch(e){return{}}};
const CL='India:91,United States:1,United Kingdom:44,United Arab Emirates:971,Saudi Arabia:966,Qatar:974,Kuwait:965,Oman:968,Bahrain:973,Singapore:65,Malaysia:60,Australia:61,Canada:1,Germany:49,France:33,Italy:39,Spain:34,Netherlands:31,Ireland:353,Switzerland:41,Sweden:46,Sri Lanka:94,Nepal:977,Bangladesh:880,Pakistan:92,Maldives:960,Japan:81,China:86,South Korea:82,Thailand:66,Indonesia:62,Philippines:63,South Africa:27,Nigeria:234,Kenya:254,New Zealand:64,Brazil:55,Mexico:52,Russia:7,Turkey:90'.split(',').map(x=>x.split(':'));
const sp=n=>{n=String(n||'').replace(/\D/g,'');const c=CL.filter(x=>n.startsWith(x[1])).sort((a,b)=>b[1].length-a[1].length)[0];return c?{c,n:n.slice(c[1].length)}:{c:CL[0],n}};
const phf=(l,id,val='')=>{const p=sp(val);return `<label>${l}</label><div class="ph"><select id="${id}_c" aria-label="Country code">${CL.map(c=>`<option value="${c[1]}" ${c[0]===p.c[0]?'selected':''}>${c[0]} (+${c[1]})</option>`).join('')}</select><input id="${id}" type="tel" inputmode="tel" placeholder="Phone number" value="${esc(p.n)}"></div>`};
const pv=id=>'+'+$('#'+id+'_c').value+v(id).replace(/\D/g,'').replace(/^0+/,'');
const save=async()=>{try{if(!JWT)throw new Error('Please log in again');await sb('/rest/v1/site?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:'main',data:S})})}catch(e){alert('Could not save to the database: '+e.message)}};
async function addEnq(e){try{await sb('/rest/v1/enquiries',{method:'POST',body:JSON.stringify({name:e.n,phone:e.ph,email:e.em||'',message:e.m,painting:e.pn})})}catch(x){console.error(x)}}
async function loadR(){const r=await sb('/rest/v1/reviews?select=work_id,rating');Object.keys(R).forEach(k=>delete R[k]);r.forEach(x=>{const o=R[x.work_id]||(R[x.work_id]={s:0,n:0});o.s+=x.rating;o.n++})}
async function loadAdm(){try{if(tab==='enquiries')ENQ=await sb('/rest/v1/enquiries?select=*&order=created_at.desc');if(tab==='reviews')REV=await sb('/rest/v1/reviews?select=id,work_id,name,rating,text,created_at&order=created_at.desc')}catch(e){alert('Could not load: '+e.message)}}
async function boot(){if(!ready)return;try{const r=await sb('/rest/v1/site?id=eq.main&select=data');if(r[0]&&r[0].data){Object.assign(S,r[0].data);fix()}await loadR()}catch(e){console.error(e)}render()}
let adm=false,tab='frames',ed=null,q='',cat='all',avf='all',cur=null,ci=0;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const stars=(n,f)=>[1,2,3,4,5].map(i=>`<span ${f?`data-a="rate" data-r="${i}" tabindex="0" role="button" aria-label="${i} star" style="cursor:pointer;font-size:26px"`:''}>${i<=Math.round(n)?'★':'☆'}</span>`).join('');
const avg=id=>{const r=R[id];return r&&r.n?r.s/r.n:0};
function pick(cb,mx=700){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)};i.click()}
function render(){const V=S.visit,L=[['gm','Email','mailto:'+S.email],['ig','Instagram',url(S.social.ig)],['fb','Facebook',url(S.social.fb)],['wa','WhatsApp','https://wa.me/'+S.wa]].filter(x=>V.show[x[0]]).map(x=>`<a class="btn o ib" ${x[0]=='gm'?'':'target="_blank" '}rel="noopener" href="${esc(x[2])}">${ic(x[0])}${x[1]}</a>`).join('');
$('#app').innerHTML=`<section class="hero" id="top"><div><div class="kick">Artify · Art Gallery</div><h1>${esc(S.tag)}</h1><p class="mut" style="max-width:440px">Original paintings, curated with soul. Explore the latest works, rate your favourites, and bring a piece home.</p><div class="row"><a class="btn" href="#gallery">View Gallery</a><a class="btn o" href="#store">Visit Store</a></div></div>
<div class="wall">${S.frames.map(f=>`<div class="frame"><img alt="Featured painting" src="${src(f)}"></div>`).join('')}</div></section>
<section id="gallery" class="alt"><div class="sh"><h2>Latest Works</h2><p>Tap a painting to view and rate it</p></div><div class="grid">${S.works.map(w=>`<div class="card" tabindex="0" role="button" data-a="work" data-id="${w.id}"><img loading="lazy" alt="${esc(w.t)}" src="${src(w.img)}"><div class="cb"><h3>${esc(w.t)}</h3><div class="mut">${esc(w.m)} · ${w.y}</div><div class="star">${stars(avg(w.id))} <span class="mut">(${(R[w.id]||{n:0}).n})</span></div></div></div>`).join('')}</div></section>
<section id="store"><div class="sh"><h2>The Store</h2><p>Original pieces available for booking</p></div>
<div class="bar"><input id="q" placeholder="Search paintings…" value="${esc(q)}"><select id="af"><option value="all">All</option><option value="1">Available</option><option value="0">Sold</option></select></div><div class="grid" id="pg"></div></section>
<section id="about" class="alt"><div class="sh"><h2>About Artify</h2></div><p style="max-width:760px;margin:0 auto 60px;text-align:center;white-space:pre-line;font-size:16px">${esc(S.aboutArt)}</p><div class="sh"><h2>Meet the Founder</h2></div><div class="ab"><div class="ring"><img alt="${esc(S.about.name)}, founder of Artify" src="${S.about.photo?src(S.about.photo):avatar(S.about.name)}"></div><div><h3 style="font-size:30px">${esc(S.about.name)}</h3><div class="kick" style="margin:4px 0 14px">${esc(S.about.role)}</div><p>${esc(S.about.text)}</p><div class="sig serif">— ${esc(S.about.name)}</div></div></div></section>

<footer><div class="logo">ARTIFY</div><p>Crafted by the artist. © ${new Date().getFullYear()} Artify. All rights reserved.</p><button class="btn o s" data-a="admin">Admin Login</button></footer>`;
$('#af').value=avf;prods()}
function prods(){const l=S.products.filter(p=>(!q||(p.n+p.d).toLowerCase().includes(q.toLowerCase()))&&(avf==='all'||String(p.av?1:0)===avf));
$('#pg').innerHTML=l.map(p=>`<div class="card" tabindex="0" role="button" data-a="prod" data-id="${p.id}"><img loading="lazy" alt="${esc(p.n)}" src="${src(p.imgs[0])}">${p.o?`<span class="tag">${Math.round(100-p.o/p.p*100)}% OFF</span>`:''}${p.av?'':'<span class="tag sold">SOLD</span>'}<div class="cb"><h3>${esc(p.n)}</h3><div class="mut">${esc(p.sz)} · ${esc(p.mat)}</div><div>${p.o?`<span class="old">${inr(p.p)}</span> <span class="off">${inr(p.o)}</span>`:`<span class="off">${inr(p.p)}</span>`}</div></div></div>`).join('')||'<p class="mut" style="text-align:center;grid-column:1/-1">No paintings found.</p>'}
const ov=h=>{const o=$('#ov');o.innerHTML=h?`<div class="modal" role="dialog" aria-modal="true"><button class="x" data-a="close" aria-label="Close">×</button>${h}</div>`:'';o.style.display=h?'block':'none';document.body.style.overflow=h?'hidden':''};
const rvForm=()=>`<label>Your rating *</label><div class="star" id="rs">${stars(0,1)}</div><label>Your name *</label><input id="rn" maxlength="60"><label>Your review</label><textarea id="rt" rows="3" maxlength="600"></textarea><div class="row"><button class="btn o s" data-a="rph">+ Add your photo (optional)</button><img id="rpv" alt="Your photo preview" style="display:none;width:44px;height:44px;border-radius:50%;object-fit:cover"></div><label id="rcl" style="display:none;gap:8px;align-items:center;color:var(--cream)"><input type="checkbox" id="rc" style="width:auto"> I allow Artify to show my photo publicly with my review</label><p id="rr" style="color:var(--err)"></p><button class="btn" data-a="rsend">Submit review</button>`;
const rvList=r=>r.length?r.map(x=>`<div class="rv"><img alt="" src="${/^data:image\/jpeg;base64,/.test(x.photo||'')?esc(x.photo):avatar(x.name)}"><div><b>${esc(x.name)}</b> <span class="star">${stars(x.rating)}</span><div class="mut">${esc(new Date(x.created_at).toLocaleDateString())}</div><p style="margin:4px 0 0">${esc(x.text)}</p></div></div>`).join(''):'<p class="mut">No reviews yet — be the first.</p>';
async function workM(id){const w=S.works.find(x=>x.id==id);cur=id;rvR=0;rvP=null;const done=mineR()[id];
ov(`<div class="two"><img class="main" alt="${esc(w.t)}" src="${src(w.img)}"><div><h2 class="serif" style="color:var(--gold)">${esc(w.t)}</h2><p class="mut">${esc(w.m)} · ${w.y}</p><div class="star">${stars(avg(id))} ${avg(id)?avg(id).toFixed(1):'No ratings yet'} <span class="mut">(${(R[id]||{n:0}).n})</span></div>${done?'<p class="mut">Thanks for reviewing this work ✓</p>':rvForm()}</div></div><h3 class="serif" style="margin:22px 0 8px;color:var(--gold)">Reviews</h3><div id="rv" class="mut">Loading…</div>`);
try{const r=await sb('/rest/v1/reviews?work_id=eq.'+id+'&select=id,name,rating,text,photo,created_at&order=created_at.desc');if(cur==id&&$('#rv'))$('#rv').innerHTML=rvList(r)}catch(e){if($('#rv'))$('#rv').textContent='Reviews are unavailable right now.'}}
function prodM(id){const p=S.products.find(x=>x.id==id);cur=id;const price=p.o?`<span class="old">${inr(p.p)}</span> <span class="off">${inr(p.o)}</span>`:`<span class="off">${inr(p.p)}</span>`;
ov(`<div class="two"><div><img class="main" alt="${esc(p.n)}" src="${src(p.imgs[ci])}"><div class="th">${p.imgs.map((m,i)=>`<img data-a="ci" data-i="${i}" class="${i==ci?'on':''}" alt="Photo ${i+1}" src="${src(m)}">`).join('')}</div></div><div><h2 class="serif" style="color:var(--gold)">${esc(p.n)}</h2><p>${esc(p.d)}</p><p class="mut">Size: ${esc(p.sz)}<br>Material: ${esc(p.mat)}<br>Status: ${p.av?'Available':'Sold'}</p><p>${price}</p>${p.av?'<button class="btn" data-a="enq">Book / Enquire</button>':''}</div></div>`)}
function enqM(id){const p=S.products.find(x=>x.id==id);ov(`<h2 class="serif" style="color:var(--gold)">Enquire about “${esc(p.n)}”</h2><label>Your name *</label><input id="en">${phf('Phone number *','ep')}<label>Email (optional)</label><input id="ee" type="email"><label>Message</label><textarea id="em" rows="3">I'm interested in booking this painting.</textarea><p id="er" style="color:var(--err)"></p><div class="row"><button class="btn" data-a="send">Submit enquiry</button></div>`)}
function sent(e){const t=e.t||`Hello Artify, I'd like to book "${e.pn}" (${e.price}). Name: ${e.n}, Phone: ${e.ph}. ${e.m}`;ov(`<h2 class="serif" style="color:var(--gold)">Enquiry received ✓</h2><p>Thank you, ${esc(e.n)}. Send it directly to the artist for a faster reply:</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(S.wa)}?text=${encodeURIComponent(t)}">Send via WhatsApp</a><a class="btn o" href="mailto:${esc(S.email)}?subject=${encodeURIComponent('Enquiry: '+e.pn)}&body=${encodeURIComponent(t)}">Send via Email</a></div>`)}
function commM(){ov(`<h2 class="serif" style="color:var(--gold)">Commission a painting</h2><p class="mut">Tell us your idea and we will create a one-of-a-kind artwork for you.</p>${fld('Your name *','cn','')}${phf('Phone number *','cp')}${fld('Email (optional)','ce','','email')}${fld('Preferred size','cs','')}${fld('Medium / style (oil, acrylic, portrait…)','cm','')}${fld('Budget (₹)','cb','')}${fld('Needed by (date)','cd','')}<label>Describe your idea *</label><textarea id="cx" rows="4"></textarea><p id="cr" style="color:var(--err)"></p><div class="row"><button class="btn" data-a="csend">Submit request</button></div>`)}
const fld=(l,id,v,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
function admM(){if(!adm)return ov(`<h2 class="serif" style="color:var(--gold)">Admin login</h2><label>Admin email</label><input id="am" type="email" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><p id="ae" style="color:var(--err)"></p><div class="row"><button class="btn" data-a="login">Login</button></div><div class="note">Sign in with the admin account created in your database dashboard.</div>`);
const T=['frames','about','visit','products','enquiries','reviews','settings'];let b='';
if(tab==='frames')b=`<p class="mut">Replace the paintings hanging in the hero section.</p><div class="row">${S.frames.map((f,i)=>`<div style="width:150px"><img class="main" alt="" src="${src(f)}"><button class="btn s" style="margin-top:6px" data-a="fup" data-i="${i}">Change frame ${i+1}</button></div>`).join('')}</div>${fld('Tagline','tg',S.tag)}<div class="row"><button class="btn" data-a="stag">Save tagline</button></div>`;
if(tab==='about'){const A=S.about;b=`<div class="row"><div style="width:150px"><img class="main" style="border-radius:50%;aspect-ratio:1" alt="" src="${A.photo?src(A.photo):avatar(A.name)}"></div><div class="row" style="align-self:flex-end"><button class="btn s" data-a="abph">Change photo</button>${A.photo?'<button class="btn s o" data-a="abrm">Remove photo</button>':''}</div></div><label>About Artify (shown first on the About page)</label><textarea id="aat" rows="5">${esc(S.aboutArt)}</textarea><h3 class="serif" style="margin-top:18px">Founder</h3>${fld('Name','abn',A.name)}${fld('Title','abr',A.role)}<label>Description</label><textarea id="abt" rows="8">${esc(A.text)}</textarea><div class="row"><button class="btn" data-a="absave">Save about</button></div>`}
if(tab==='visit'){const V=S.visit,ck=(k,l)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--cream)"><input type="checkbox" style="width:auto" id="sh_${k}" ${V.show[k]?'checked':''}>${l}</label>`;b=`${fld('Page heading','vt',V.title)}${fld('Subheading','vs',V.sub)}<h3 class="serif" style="margin-top:18px">Contact links</h3>${fld('Email address','ml',S.email)}${ck('gm','Show Email')}${fld('Instagram link','ig',S.social.ig)}${ck('ig','Show Instagram')}${fld('Facebook link','fb',S.social.fb)}${ck('fb','Show Facebook')}${phf('WhatsApp number','wa',S.wa)}${ck('wa','Show WhatsApp')}<h3 class="serif" style="margin-top:18px">Commission button</h3>${ck('cm','Show commission button')}${fld('Button text','vc',V.cmText)}<div class="row"><button class="btn" data-a="svisit">Save Visit page</button></div>`}
if(tab==='products'){b=ed?`<h3 class="serif">${ed.id?'Edit':'New'} product</h3>${fld('Name','pn',ed.n)}${fld('Details','pd',ed.d)}${fld('Size','psz',ed.sz)}${fld('Material','pm',ed.mat)}${fld('Price (₹)','pp',ed.p,'number')}${fld('Offer price (₹, 0 = none)','po',ed.o,'number')}<label>Availability</label><select id="pa"><option value="1" ${ed.av?'selected':''}>Available</option><option value="0" ${ed.av?'':'selected'}>Sold</option></select><label>Photos</label><div class="th">${ed.imgs.map((m,i)=>`<img data-a="rmimg" data-i="${i}" title="Click to remove" src="${src(m)}" alt="">`).join('')}</div><div class="row"><button class="btn o s" data-a="aimg">+ Add photo</button></div><div class="row"><button class="btn" data-a="psave">Save</button><button class="btn o" data-a="pcancel">Cancel</button></div>`
:`<button class="btn s" data-a="pnew">+ Add product</button><div class="scroll"><table>${S.products.map(p=>`<tr><td>${esc(p.n)}</td><td>${inr(p.o||p.p)}</td><td>${p.av?'Available':'Sold'}</td><td><button class="btn s o" data-a="pedit" data-id="${p.id}">Edit</button> <button class="btn s r" data-a="pdel" data-id="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`}
if(tab==='enquiries')b=ENQ.length?`<div class="scroll"><table><tr><th>Date</th><th>Name</th><th>Phone</th><th>Painting</th><th>Message</th><th>Status</th></tr>${ENQ.map((e,i)=>`<tr><td>${esc(new Date(e.created_at).toLocaleString())}</td><td>${esc(e.name)}<br><span class="mut">${esc(e.email)}</span></td><td><a href="tel:${esc(e.phone)}">${esc(e.phone)}</a></td><td>${esc(e.painting)}</td><td>${esc(e.message)}</td><td><select data-a="est" data-i="${i}">${['New','Contacted','Closed'].map(s=>`<option ${s==e.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<p class="mut">No enquiries yet.</p>';
if(tab==='reviews')b=REV.length?`<div class="scroll"><table><tr><th>Date</th><th>Work</th><th>Name</th><th>Rating</th><th>Review</th><th></th></tr>${REV.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleDateString())}</td><td>${esc((S.works.find(w=>w.id==x.work_id)||{}).t)}</td><td>${esc(x.name)}</td><td>${x.rating}★</td><td>${esc(x.text)}</td><td><button class="btn s r" data-a="rdel" data-id="${x.id}">Delete</button></td></tr>`).join('')}</table></div>`:'<p class="mut">No reviews yet.</p>';
if(tab==='settings')b=`${fld('New admin password','npw','','password')}<div class="row"><button class="btn o" data-a="spw">Change password</button><button class="btn r" data-a="logout">Log out</button></div>`;
ov(`<h2 class="serif" style="color:var(--gold)">Admin dashboard</h2><div class="tabs">${T.map(t=>`<button class="btn s ${t==tab?'':'o'}" data-a="tab" data-t="${t}">${t}</button>`).join('')}</div>${b}`)}
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;prods()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='af'){avf=t.value;prods()}if(t.dataset.a==='est'){const e=ENQ[t.dataset.i];e.status=t.value;sb('/rest/v1/enquiries?id=eq.'+e.id,{method:'PATCH',body:JSON.stringify({status:t.value})}).catch(x=>alert('Could not update: '+x.message))}});
const v=id=>$('#'+id).value;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').style.display==='block')ov('');if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-a],[data-a=rate]')){e.preventDefault();e.target.click()}});
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov'&&!adm)ov('')});
document.addEventListener('click',async e=>{if(e.target.closest('nav a')){$('header').classList.remove('open');$('.mb').setAttribute('aria-expanded','false')}const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;const a=t.dataset.a,d=t.dataset;
if(a==='theme')setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');else if(a==='menu'){const h=$('header');h.classList.toggle('open');t.setAttribute('aria-expanded',h.classList.contains('open'))}else if(a==='close')ov('');else if(a==='work'){workM(d.id)}else if(a==='prod'){ci=0;prodM(d.id)}else if(a==='ci'){ci=+d.i;prodM(cur)}
else if(a==='rate'){rvR=+d.r;$('#rs').innerHTML=stars(rvR,1)}
else if(a==='rph')pick(u=>{rvP=u;$('#rpv').src=u;$('#rpv').style.display='';$('#rcl').style.display='flex'},160);
else if(a==='rsend'){const n=v('rn').trim();if(!n||!rvR){$('#rr').textContent='Please add your name and a star rating.';return}t.disabled=true;try{await sb('/rest/v1/reviews',{method:'POST',body:JSON.stringify({work_id:cur,name:n,rating:rvR,text:v('rt').trim(),photo:rvP&&$('#rc').checked?rvP:null})});const m=mineR();m[cur]=1;try{localStorage.setItem('artify_mine',JSON.stringify(m))}catch(x){}await loadR();workM(cur);render()}catch(x){t.disabled=false;$('#rr').textContent='Could not submit your review. Please try again.'}}
else if(a==='rdel'){if(confirm('Delete this review?')){try{await sb('/rest/v1/reviews?id=eq.'+d.id,{method:'DELETE'});await loadAdm();await loadR();admM();render()}catch(x){alert('Could not delete: '+x.message)}}}
else if(a==='enq')enqM(cur);
else if(a==='send'){const n=v('en').trim(),ph=pv('ep');if(!n||v('ep').replace(/\D/g,'').length<6){$('#er').textContent='Please enter your name and a valid phone number.';return}const p=S.products.find(x=>x.id==cur);const en={dt:new Date().toLocaleString(),n,ph,em:v('ee'),m:v('em'),pn:p.n,price:inr(p.o||p.p),st:'New'};await addEnq(en);sent(en)}
else if(a==='comm')commM();
else if(a==='csend'){const n=v('cn').trim(),ph=pv('cp'),x=v('cx').trim();if(!n||v('cp').replace(/\D/g,'').length<6||!x){$('#cr').textContent='Please enter your name, a valid phone number and your idea.';return}const m=`Idea: ${x} | Size: ${v('cs')||'-'} | Style: ${v('cm')||'-'} | Budget: ${v('cb')||'-'} | Needed by: ${v('cd')||'-'}`;const en={dt:new Date().toLocaleString(),n,ph,em:v('ce'),m,pn:'Commissioned work',st:'New',t:`Hello Artify, I'd like to commission a painting. ${m}. Name: ${n}, Phone: ${ph}.`};await addEnq(en);sent(en)}
else if(a==='admin')admM();
else if(a==='login'){if(!ready){$('#ae').textContent='Database not connected yet — add your keys in the code.';return}try{const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:v('am').trim(),password:v('ap')})});JWT=r.access_token;adm=true;admM()}catch(x){$('#ae').textContent='Incorrect email or password.'}}
else if(a==='logout'){adm=false;JWT=null;ov('')}
else if(a==='tab'){tab=d.t;ed=null;await loadAdm();admM()}
else if(a==='fup')pick(u=>{S.frames[d.i]=u;save();render();admM()});
else if(a==='abph')pick(u=>{S.about.photo=u;save();render();admM()});
else if(a==='abrm'){S.about.photo=null;save();render();admM()}
else if(a==='absave'){S.aboutArt=v('aat');Object.assign(S.about,{name:v('abn'),role:v('abr'),text:v('abt')});save();render();admM()}
else if(a==='stag'){S.tag=v('tg');save();render();admM()}
else if(a==='svisit'){const V=S.visit;V.title=v('vt');V.sub=v('vs');V.cmText=v('vc');S.email=v('ml');S.wa=pv('wa').replace(/\D/g,'');S.social={ig:v('ig'),fb:v('fb')};['gm','ig','fb','wa','cm'].forEach(k=>V.show[k]=$('#sh_'+k).checked?1:0);save();render();admM()}
else if(a==='spw'){if(v('npw').length<6)return alert('Use at least 6 characters.');try{await sb('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:v('npw')})});alert('Password changed.')}catch(x){alert('Could not change password: '+x.message)}}
else if(a==='pnew'){ed={n:'',d:'',sz:'',mat:'',p:0,o:0,av:1,imgs:[]};admM()}
else if(a==='pedit'){ed=JSON.parse(JSON.stringify(S.products.find(x=>x.id==d.id)));admM()}
else if(a==='pcancel'){ed=null;admM()}
else if(a==='pdel'){if(confirm('Delete this product?')){S.products=S.products.filter(x=>x.id!=d.id);S.works=S.works.filter(x=>x.id!=d.id);save();render();admM()}}
else if(a==='aimg')pick(u=>{keep();ed.imgs.push(u);admM()});
else if(a==='rmimg'){keep();ed.imgs.splice(d.i,1);admM()}
else if(a==='psave'){keep();if(!ed.n)return alert('Name required');if(!ed.imgs.length)ed.imgs=[S.products.length+30];if(ed.id){S.products=S.products.map(x=>x.id==ed.id?ed:x)}else{ed.id=Math.max(0,...S.products.map(x=>x.id),...S.works.map(x=>x.id))+1;S.products.push(ed)}syncWork(ed);save();ed=null;render();admM()}});
function syncWork(p){const w=S.works.find(x=>x.id==p.id),o={t:p.n,m:p.mat,img:p.imgs[0]};if(w)Object.assign(w,o);else S.works.unshift({id:p.id,y:new Date().getFullYear(),...o})}
function keep(){if(!ed||!$('#pn'))return;Object.assign(ed,{n:v('pn'),d:v('pd'),sz:v('psz'),mat:v('pm'),p:+v('pp'),o:+v('po'),av:+v('pa')})}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('artify_theme',t)}catch(e){}$('#tb').textContent=t==='light'?'☾ Dark':'☀ Light'}
let th;try{th=localStorage.getItem('artify_theme')}catch(e){}
setTheme(th||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
render();boot();
</script></body></html>
